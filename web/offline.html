<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Reconnect · LAN Games</title>
  <link rel="stylesheet" href="/shared/shared.css">
  <style>
    body { overflow:auto; display:grid; place-items:center; min-height:100dvh; padding:24px;
      background:radial-gradient(circle at 50% 15%,rgba(34,211,238,.12),transparent 43%),#070b14; }
    main { width:min(100%,390px); text-align:center; padding:30px 22px; border:1px solid var(--line);
      border-radius:24px; background:var(--surface); box-shadow:0 30px 80px rgba(0,0,0,.5); }
    .mark { width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
      font-size:31px;background:var(--grad);color:#06101b;box-shadow:0 12px 36px rgba(91,140,255,.3); }
    h1 { font-size:27px;letter-spacing:-.04em; } p { margin:10px 0 21px;color:var(--muted);line-height:1.55;font-size:13px; }
    .btn { display:grid;place-items:center;text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌁</div>
    <h1>GAME NIGHT IS OFFLINE</h1>
    <p>Reconnect to the host Wi‑Fi, then retry. Multiplayer state always stays on the local game server.</p>
    <a class="btn btn-primary btn-big" href="/">TRY AGAIN</a>
  </main>
</body>
</html>
